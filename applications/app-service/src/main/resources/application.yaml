server:
  port: 8080

adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: crediya_bd
    schema: public
    username: postgres
    password: root

logging:
  level:
    co.com.pragma: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    org.springframework.r2dbc: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"